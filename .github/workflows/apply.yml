name: Submit application

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (no POST). Set to false to submit for real.
        type: boolean
        default: true

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -p "test_*.py" -v

      - name: Submit
        env:
          APPLICANT_NAME: ${{ secrets.APPLICANT_NAME }}
          APPLICANT_EMAIL: ${{ secrets.APPLICANT_EMAIL }}
          RESUME_LINK: ${{ secrets.RESUME_LINK }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python submit.py

      - name: Upload receipt
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: receipt
          path: receipt.txt
